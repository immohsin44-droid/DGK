/* Layout: one-column phone app, sticky top bar + bottom tab bar; cards only for the summary and lists. */
:root{
  --bg:#e7ebf2; --surface:#f7f8fb; --fg:#141d2e; --muted:#56627a; --line:#d2d9e5; --accent:#1b2b4b; --accent-soft:#dde3ee; --tile:#edf0f6;

}

  --bg:#0f1622; --surface:#172131; --fg:#e7ecf4; --muted:#9aa7bb; --line:#2a3647; --accent:#9db4e0; --accent-soft:#1d2c46; --tile:#121b29; --hdr:#1b2b4b;
  --good:#6fd18f; --good-bg:#17361f; --warn:#f1c75a; --warn-bg:#3a2f10; --bad:#ff8f78; --bad-bg:#3d1c15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --fg:#e7ecf4; --muted:#9aa7bb; --line:#2a3647; --accent:#9db4e0; --accent-soft:#1d2c46; --tile:#121b29; --hdr:#1b2b4b;
  --good:#6fd18f; --good-bg:#17361f; --warn:#f1c75a; --warn-bg:#3a2f10; --bad:#ff8f78; --bad-bg:#3d1c15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:grid;gap:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-fg)}
header .in{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
header h1{font-family:var(--font-head);font-size:17px;margin:0;line-height:1.15;min-width:0;flex:1}
header h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--hdr-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
header h1 .brand{display:block;font:700 10.5px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--hdr-sub);margin-bottom:2px}
header h1 #nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--hdr-line);border-radius:8px;overflow:hidden}
.lang{flex:none}.lang button{border:0;background:transparent;color:var(--hdr-sub);font:600 12px var(--font-body);padding:6px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--hdr)}
.iconbtn{flex:none;border:1px solid var(--hdr-line);background:transparent;color:var(--hdr-fg);border-radius:8px;padding:6px 9px;font:600 12px var(--font-body);cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
h2{font-family:var(--font-head);font-size:16px;margin:0 0 8px}
.note{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--tile);border-radius:10px;padding:10px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--font-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
button.kpi{border:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}
button.kpi .go{float:right;color:var(--accent);font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.g{background:var(--good-bg);color:var(--good)} .y{background:var(--warn-bg);color:var(--warn)} .r{background:var(--bad-bg);color:var(--bad)} .n{background:var(--bg);color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;position:relative;margin-top:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.rank{display:grid;gap:8px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.rk .no{font-family:var(--font-head);font-weight:700;font-size:18px;width:30px;text-align:center}
.rk.me{outline:2px solid var(--accent);background:var(--accent-soft)}
.rk .nm{flex:1;min-width:0;font-weight:600}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
select{width:100%;font:500 15px var(--font-body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--muted);font-weight:600;font-size:11.5px;padding:6px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.nm{white-space:normal;min-width:120px}
tr.click{cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.wrap>.chip{justify-self:start}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.shop{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.shop:last-child{border-bottom:0}
.shop .t{display:flex;gap:8px;align-items:baseline}
.shop .t b{flex:1;min-width:0}
.shop .m{font-size:12.5px;color:var(--muted)}
details.shop>summary{list-style:none;cursor:pointer;display:grid;gap:4px}
details.shop>summary::-webkit-details-marker{display:none}
.shop .chev{color:var(--accent);font-weight:700;font-size:18px;line-height:1;transition:transform .15s}
details.shop[open] .chev{transform:rotate(90deg)}
.shop .t2{display:flex;flex-wrap:wrap;gap:2px}
.sugbox{background:var(--good-bg);border-radius:10px;padding:8px 10px;margin-top:6px}
.sugbox .l{font-size:11.5px;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.sugbox table{font-size:14px}.sugbox td{border-bottom:1px solid var(--line);padding:5px 2px}.sugbox tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 12px var(--font-body);padding:10px 4px 12px;cursor:pointer;display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.login{display:grid;gap:12px} .okid{margin:-4px 0 0;color:#2E7D32;font-weight:600;font-size:14px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:14px 6px;font:700 14px var(--font-body);cursor:pointer}
.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.primary{border:0;background:var(--accent);color:#fff;font:700 16px var(--font-body);padding:13px;border-radius:12px;cursor:pointer}
.primary:disabled{opacity:.45}
input.pw{width:100%;font:600 18px var(--font-body);letter-spacing:.15em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600;font-size:13px;margin:0}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.stk-r td:nth-child(3){font-weight:700}
@media (max-width:380px){.big{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.chip,.role,nav.tabs button{transition:background .15s,color .15s}}
</style>

// ---------- password unlock (data slice per user, AES-GCM + PBKDF2) ----------
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function lockedD(){ const d=ENC.dir; return {meta:d.meta,towns:d.towns,obs:d.obs,keys:[],bp:{},shops:{},cp:{},stock:{}}; }
async function unlock(u,pw){
  const b=ENC.b[u.r+':'+u.c]; if(!b) throw new Error('nouser');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(b[0]),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(b[1])},key,ub64(b[2]));
  const txt=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function lockOut(){ UNL=false; store.set('pw',null); if(ENC) D=lockedD(); }

// ---------- scope helpers ----------
function scopeOBs(){ // OBs visible in lists for this user
  if(!U) return [];
  if(U.r==='ob') return [U.c];
  return Object.keys(D.obs).filter(c=>U.r==='dist'?D.obs[c].d===U.c:D.towns[D.obs[c].d].terr===U.c);
}
function dataOBs(){ return OPENOB?[OPENOB]:scopeOBs(); }
function scopeTowns(){ if(U.r==='ob') return [D.obs[U.c].d]; if(U.r==='dist') return [U.c]; return Object.keys(D.towns).filter(k=>D.towns[k].terr===U.c); }
function sumOB(list){ let tg=0,s=0; list.forEach(c=>{tg+=D.obs[c].t||0;s+=D.obs[c].s||0}); return {t:tg,s}; }
function keyMatch(k){ const K=D.keys[k]; return (!SEL.b||K[0]===SEL.b)&&(!SEL.p||K[1]===SEL.p); }
function idxOf(t_,s_){ return t_>0? (s_/t_)/D.meta.TG : null; }

function brandPackRows(list){ // aggregate bp over OBs: per key [t,s,out,ps,po]
  const agg={}; list.forEach(c=>(D.bp[c]||[]).forEach(r=>{const a=agg[r[0]]||(agg[r[0]]=[0,0,0,0,0,0]);for(let i=1;i<7;i++)a[i-1]+=r[i]||0}));
  return agg;
}

function visitsLeft(days,from){ let n=0; const e=lastBook(); for(let d=new Date(from); d<=e; d.setDate(d.getDate()+1)){ if(d.getDay()!==5 && days.includes((d.getDay()+6)%7)) n++; } return n; }
function shopCard({x,mtd,miss,win,zmiss,zhist,sg},ZON,zl){

  const has=sg&&sg.list.length; const sl=new Set(has?sg.list.map(z=>D.keys[z.k][0]+' '+abbr(D.keys[z.k][1])):[]); miss=miss.filter(m=>!sl.has(m));
  const body=(has?`<div class="sugbox"><div class="l">${t('sugg')} · ${sg.list.length} items · ${f1(sg.ctn)} ${t('ctn')}</div><table>`+sg.list.map(z=>`<tr><td>${esc(D.keys[z.k][0])} <span class="note">${abbr(D.keys[z.k][1])}</span></td><td><b>${z.box}</b> ${t('box')}</td></tr>`).join('')+`</table></div>`:`<div class="m">${t('nosugg')}</div>`)
    +(miss.length?`<div class="m">${t('pitch')}: ${esc(miss.join(' · '))}</div>`:'');
  return `<details class="shop"><summary><div class="t"><b>${esc(x[1])}</b>${has?`<span class="pill g">${f1(sg.ctn)} ${t('ctn')}</span>`:''}<span class="chev">›</span></div><div class="t2">${tags}</div>${line}</summary>${body}</details>`;
}
function suggestShop(x,c,date){
  const dist=D.obs[c].d; const st={}; (D.stock[dist]||[]).forEach(r=>st[r[0]]=r);
  const vl=Math.max(1,visitsLeft(x[3],date)); let L_=[], nost=[];
  Object.entries(x[13]||{}).forEach(([k,[rem,norm]])=>{ k=+k; const K=D.keys[k]; const bx=K[3]||0; if(!bx) return;
    const s_=st[k]; if(s_&&s_[2]>0&&(s_[1]||0)/s_[2]<0.2){ nost.push(k); return; }
    const capf=(x[4]==='W'&&(K[1]==='Snack Pack'||K[1]==='Munch Pack'))?1:1.5;
    const q=Math.min(rem/vl, norm*capf); L_.push({k,q,bx}); });
  let tot=L_.reduce((a,r)=>a+r.q,0); const cap=1.5*(x[14]||0); if(cap>0&&tot>cap){ const f=cap/tot; L_.forEach(r=>r.q*=f); }
  L_=L_.map(r=>({...r,box:Math.round(r.q*r.bx)})).filter(r=>r.box>=1).map(r=>({...r,ctn:r.box/r.bx})).sort((a,b)=>b.ctn-a.ctn);
  return {list:L_, ctn:L_.reduce((a,r)=>a+r.ctn,0), nost, vl};
}
let SGMAP=new Map(); const sgOf=x=>SGMAP.get(x);
function planCard(c,rows,pd){
  const o=D.obs[c]; const tot=rows.reduce((a,r)=>a+(r.sg?r.sg.ctn:0),0); const nshop=rows.filter(r=>r.sg&&r.sg.ctn>0).length;
  const win=rows.filter(r=>r.win).length; const need=o.need||0;
  const agg=brandPackRows([c]); const by={}; Object.keys(agg).forEach(k=>{const b=D.keys[k][0];const a=by[b]||(by[b]=[0,0]);a[0]+=agg[k][0];a[1]+=agg[k][1]});
  const behind=Object.entries(by).filter(([b,a])=>a[0]>=1&&idxOf(a[0],a[1])<0.88).map(([b,a])=>({b,i:idxOf(a[0],a[1]),n:Math.max(0,a[0]-a[1])/D.meta.REM})).sort((x,y)=>y.n-x.n).slice(0,4);
  const st={}; (D.stock[o.d]||[]).forEach(r=>st[r[0]]=r); const mine=new Set((D.bp[c]||[]).filter(r=>r[1]>0).map(r=>r[0]));
  const out=[...mine].filter(k=>st[k]&&st[k][2]>0&&(st[k][1]||0)/st[k][2]<0.2).map(k=>D.keys[k][0]+' '+abbr(D.keys[k][1]));
  const pct=need?tot/need:null;
  PLANTXT=`${o.n} · ${fmtD(pd)}\n${t('sugg')}: ${f1(tot)} ${t('ctn')} / ${t('need')} ${f1(need)}\n`+rows.filter(r=>r.sg&&r.sg.list.length).slice(0,10).map((r,i)=>`${i+1}. ${r.x[1]}: `+r.sg.list.slice(0,6).map(z=>D.keys[z.k][0]+' '+abbr(D.keys[z.k][1])+' '+z.box).join(', ')).join('\n')+(behind.length?`\n${t('focusb')}: `+behind.map(z=>z.b).join(', '):'')+(out.length?`\n${t('nostock')}: `+out.join(', '):'');
  return `<div class="card"><h2>${t('plan')} · ${fmtD(pd)}</h2><div class="big">
   <div class="kpi"><div class="l">${t('sugg')}</div><div class="v">${f1(tot)}</div><div class="s">${nshop} shops · ${t('ctn')}</div></div>
   <div class="kpi"><div class="l">${t('need')}</div><div class="v">${f1(need)}</div><div class="s"><span class="pill ${pct==null?'n':pct>=1?'g':pct>=0.85?'y':'r'}">${pc(pct)}</span> ${t('covered')}</div></div></div>
   ${win?`<p class="note"><span class="tag r">${t('wapis')}</span> ${win} shops</p>`:''}
   ${behind.length?`<p class="note"><b>${t('focusb')}:</b> ${behind.map(z=>`${esc(z.b)} <span class="pill ${cls(z.i)}">${ix(z.i)}</span> ${f1(z.n)}/${L==='en'?'day':'din'}`).join(' · ')}</p>`:''}
   ${out.length?`<p class="note"><b>${t('nostock')} (${out.length}):</b> ${esc(out.slice(0,6).join(' · '))}${out.length>6?` <details style="display:inline"><summary style="display:inline;cursor:pointer;color:var(--accent)">+${out.length-6}</summary>${esc(out.slice(6).join(' · '))}</details>`:''}</p>`:''}
   <details class="note"><summary style="cursor:pointer;color:var(--accent)">${t('how')}</summary>${t('sugnote')}</details>${U.r!=='ob'?`<button class="chip" id="cp-plan" style="justify-self:start;margin-top:8px">${t('copyplan')}</button>`:''}</div>`;
}
let PLANTXT='';
const fmtD=d=>d.toLocaleDateString(L==='en'?'en-GB':'en-GB',{weekday:'short',day:'2-digit',month:'short'});
const abbr=p=>({'Family Pack':'FP','Half Roll':'HR','Snack Pack':'SP','Munch Pack':'MP','Ticky Pack':'TP','Jumbo Pack':'Jumbo'})[p]||p;


// ---------- merchandising: top 5 retail shops of the route (last 3 weeks purchase) ----------
let MCHK=store.get('mchk')||{};
function viewMerch(){
  const list = OPENOB?[OPENOB]: U.r==='ob'?[U.c]:null;
  if(!list){
    $('#main').innerHTML=`<div class="card"><h2>${t('merch')}</h2><p class="note">${t('tapob')}</p><div class="tw"><table><tr><th>OB</th><th>${t('town')}</th></tr>`+
      scopeOBs().map(c=>`<tr class="click" data-ob="${c}"><td class="nm">${esc(D.obs[c].n)}</td><td>${D.towns[D.obs[c].d].n}</td></tr>`).join('')+`</table></div></div>`;
    document.querySelectorAll('tr[data-ob]').forEach(r=>r.onclick=()=>{OPENOB=r.dataset.ob;render();window.scrollTo(0,0)}); return;
  }
  const c=list[0]; if(DAY===null||DAY===-1) DAY=todayWD();
  const all=D.shops[c]||[]; const daysUsed=[...new Set(all.flatMap(x=>x[3]))].sort();
  const top=all.filter(x=>x[3].includes(DAY)&&x[4]==='R').sort((a,b)=>((b[15]||0)-(a[15]||0))||((b[7]||0)-(a[7]||0))).slice(0,5);
  const pd_=planDate(DAY); const dk=pd_.toISOString().slice(0,10);
  const brandsOf=x=>{const h={};Object.entries(x[9]).forEach(([k,v])=>{const b=D.keys[k][0];h[b]=(h[b]||0)+v});const m=new Set(Object.keys(x[8]).map(k=>D.keys[k][0]));
    return Object.entries(h).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([b])=>({b,m:m.has(b)}))};
  const ck=(x,i)=>!!(MCHK[dk+'|'+c+'|'+x[0]]||[])[i];
  const cards=top.map((x,n)=>{const br=brandsOf(x); const done=t('chk').filter((_,i)=>ck(x,i)).length;
    return `<div class="card"><div class="shop" style="border:0;padding:0"><div class="t"><b>${n+1}. ${esc(x[1])}</b><span class="tag n">${t('retail')} ${x[5]}</span><span class="pill ${done===5?'g':done?'y':'n'}">${done}/5</span></div>
     <div class="m">${t('m3w')}: <b>${f1(x[15])}</b> ${t('perwk')} · ${t('avgm')}: ${f1(x[7])} · ${lastTxt(x)}</div>
     <div class="m" style="margin-top:6px"><b>${t('shelf')}:</b></div><div class="t2">${br.map(z=>`<span class="pill ${z.m?'g':'y'}" style="margin:2px 2px 0 0">${esc(z.b)}</span>`).join('')||`<span class="note">${t('nohist')}</span>`}</div>
     <div style="display:grid;gap:6px;margin-top:10px">${t('chk').map((l,i)=>`<label class="chk" style="color:var(--fg);font-size:14px"><input type="checkbox" data-mk="${x[0]}" data-i="${i}" ${ck(x,i)?'checked':''}> ${l}</label>`).join('')}</div></div></div>`}).join('');
  $('#main').innerHTML=`${OPENOB?`<button class="chip" id="bk">← ${t('back')} · ${esc(D.obs[OPENOB].n)}</button>`:''}
   <div class="card"><h2>${t('mtop')}</h2><div class="chips">${daysUsed.map(d=>`<button class="chip" data-d="${d}" aria-pressed="${d===DAY}">${t('day')[d]}</button>`).join('')}</div>
   <p class="note">${t('mnote')}</p><p class="note">${t('mlegend')}</p><button class="chip" id="m-cp" style="margin-top:8px">${t('mcopy')}</button></div>
   ${cards||`<div class="card empty">${t('none')}</div>`}`;
  document.querySelectorAll('input[data-mk]').forEach(b=>b.onchange=e=>{const key=dk+'|'+c+'|'+e.target.dataset.mk;const a=MCHK[key]||[0,0,0,0,0];a[+e.target.dataset.i]=e.target.checked?1:0;MCHK[key]=a;
    Object.keys(MCHK).forEach(k=>{if(k.slice(0,10)<new Date(Date.now()-7*864e5).toISOString().slice(0,10))delete MCHK[k]});store.set('mchk',MCHK);render()});
  document.querySelectorAll('.chip[data-d]').forEach(b=>b.onclick=()=>{DAY=+b.dataset.d;render()});
  if($('#bk')) $('#bk').onclick=()=>{OPENOB=null;render()};
  $('#m-cp').onclick=e=>{const b=e.target;
    const txt=`${t('mrep')} · ${D.obs[c].n} (${c}) · ${D.towns[D.obs[c].d].n} · ${fmtD(pd_)}\n`+top.map((x,n)=>{const br=brandsOf(x).filter(z=>!z.m).map(z=>z.b);
      return `${n+1}. ${x[1]}: `+t('chk').map((l,i)=>(ck(x,i)?'✅ ':'❌ ')+l).join(' | ')+(br.length?`\n   ${t('notinshelf')}: ${br.join(', ')}`:'')}).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{b.textContent=t('copied')}).catch(()=>{b.textContent=t('copyfail')})};
}

function viewStock(){
  const towns=OPENOB?[D.obs[OPENOB].d]:scopeTowns();
  const filt=k=>(!SEL.b||D.keys[k][0]===SEL.b)&&(!SEL.p||D.keys[k][1]===SEL.p);
  const brands=[...new Set(towns.flatMap(tw=>(D.stock[tw]||[]).filter(r=>r[2]>0).map(r=>D.keys[r[0]][0])))];
  let html=`<div class="card"><label class="f">${t('brand')}<select id="s-b"><option value="">${t('allb')}</option>${brands.map(b=>`<option ${SEL.b===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
    <p class="note">${t('stockt')} · ${D.meta.stk} closing · ${t('days')} = stock ÷ ${L==='en'?'daily target':'roz ka target'}</p></div>`;
  towns.forEach(tw=>{
    const rs=(D.stock[tw]||[]).filter(r=>r[2]>0&&filt(r[0])).map(r=>({k:r[0],st:r[1]||0,dt:r[2],d:(r[1]||0)/r[2]})).sort((a,b)=>a.k-b.k);
    const out=rs.filter(r=>r.st<=0.05).length, low=rs.filter(r=>r.st>0.05&&r.d<2).length;
    html+=`<div class="card"><h2>${D.towns[tw].n}</h2><p class="note"><span class="pill r">${out}</span> ${t('out')} · <span class="pill y">${low}</span> ${t('low')}</p>
     <div class="tw"><table class="stk-r"><tr><th>${t('brand')}</th><th>${t('pack')}</th><th>${t('days')}</th><th>${t('ctn')}</th></tr>`+
     rs.map((r,i)=>`<tr${i&&D.keys[rs[i-1].k][0]!==D.keys[r.k][0]?' style="border-top:2px solid var(--line)"':''}><td>${i&&D.keys[rs[i-1].k][0]===D.keys[r.k][0]?'':'<b>'+esc(D.keys[r.k][0])+'</b>'}</td><td>${abbr(D.keys[r.k][1])}</td><td><span class="pill ${r.st<=0.05?'r':r.d<2?'y':'g'}">${r.st<=0.05?'0':r.d.toFixed(1)}</span></td><td>${f1(r.st)}</td></tr>`).join('')+`</table></div></div>`;
  });
  $('#main').innerHTML=html; $('#s-b').onchange=e=>{SEL.b=e.target.value;SEL.p='';render()};
}

(window.__D?Promise.resolve(window.__D):fetch('data.json').then(r=>r.json())).then(async j=>{
  if(j.enc){ ENC=j; D=lockedD(); const pw=store.get('pw'); if(U&&pw){ try{ D=await unlock(U,pw); UNL=true; }catch(e){ lockOut(); } } }
  else D=j;
  render()}).catch(()=>{$('#main').innerHTML='<div class="card empty">Data could not load. Pull down to refresh.</div>'});
setLang(L);
</script>
